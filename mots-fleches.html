<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mots fléchés personnalisés</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg: #faf7f2;
      --card: #fff;
      --ink: #2a2622;
      --dim: #7b736a;
      --line: #e4ddd2;
      --acc: #b8860b;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media(prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #1d1b19;
        --card: #292624;
        --ink: #f0ebe3;
        --dim: #a39b90;
        --line: #3d3935
      }
    }

    :root[data-theme="dark"] {
      --bg: #1d1b19;
      --card: #292624;
      --ink: #f0ebe3;
      --dim: #a39b90;
      --line: #3d3935
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif
    }

    header {
      padding: 22px 20px 6px;
      max-width: 1100px;
      margin: auto
    }

    h1 {
      margin: 0;
      font: 700 26px Georgia, "Times New Roman", serif
    }

    h1 b {
      color: var(--acc)
    }

    header p {
      margin: 4px 0 0;
      color: var(--dim)
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 380px) minmax(0, 1fr);
      gap: 20px;
      max-width: 1100px;
      margin: auto;
      padding: 14px 20px 40px
    }

    @media(max-width:820px) {
      main {
        grid-template-columns: 1fr
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--dim);
      margin: 12px 0 4px;
      text-transform: uppercase;
      letter-spacing: .04em
    }

    label:first-child {
      margin-top: 0
    }

    input[type=text],
    select,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      color: var(--ink);
      font: inherit
    }

    textarea {
      min-height: 190px;
      resize: vertical;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 13px
    }

    .row {
      display: flex;
      gap: 10px
    }

    .row>* {
      flex: 1;
      min-width: 0
    }

    .chk {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      text-transform: none;
      font-size: 13px;
      color: var(--ink);
      font-weight: 400;
      letter-spacing: 0
    }

    .chk input {
      margin-top: 3px
    }

    .sw {
      display: flex;
      gap: 8px;
      margin-top: 2px
    }

    .sw button {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 3px solid var(--card);
      box-shadow: 0 0 0 1px var(--line);
      cursor: pointer
    }

    .sw button.on {
      box-shadow: 0 0 0 2px var(--ink)
    }

    .btns {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap
    }

    button.p {
      flex: 1;
      padding: 11px 14px;
      border: 0;
      border-radius: 9px;
      background: var(--acc);
      color: #fff;
      font: 600 14px inherit;
      cursor: pointer
    }

    button.s {
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: transparent;
      color: var(--ink);
      font: 600 14px inherit;
      cursor: pointer
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px
    }

    .tabs button {
      padding: 6px 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      font: inherit
    }

    .tabs button.on {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink)
    }

    #info {
      font-size: 13px;
      color: var(--dim);
      margin: 0 0 12px;
      min-height: 20px
    }

    #info.w {
      color: #c0561d
    }

    #prev {
      display: flex;
      justify-content: center
    }

    #prev svg {
      width: 100%;
      max-width: 520px;
      height: auto;
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, .18)
    }

    .hint {
      font-size: 12px;
      color: var(--dim);
      margin-top: 6px
    }

    body {
      background: radial-gradient(900px 380px at 85% -80px, color-mix(in srgb, var(--acc) 15%, transparent), transparent), var(--bg)
    }

    header {
      padding: 36px 20px 12px
    }

    h1 {
      font: 800 36px/1.1 Fraunces, Georgia, serif;
      letter-spacing: -.02em
    }

    header p {
      max-width: 560px;
      font-size: 16px
    }

    .card {
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 14px 34px -14px rgba(0, 0, 0, .2)
    }

    @media(min-width:821px) {
      main>section:last-child {
        position: sticky;
        top: 12px;
        align-self: start
      }
    }

    input[type=text]:focus,
    select:focus,
    textarea:focus {
      outline: 3px solid color-mix(in srgb, var(--acc) 30%, transparent);
      border-color: var(--acc)
    }

    button {
      transition: all .15s
    }

    button.p {
      box-shadow: 0 8px 18px -8px var(--acc)
    }

    button.p:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.08)
    }

    button.s:hover:not(:disabled) {
      border-color: var(--acc);
      color: var(--acc)
    }

    .sw button:hover {
      transform: scale(1.12)
    }

    .tabs {
      background: var(--bg);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--line);
      width: max-content
    }

    .tabs button {
      border: 0;
      padding: 7px 20px;
      border-radius: 999px;
      font-weight: 600
    }

    #info {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13px
    }

    #info.w {
      border-color: #c0561d66;
      background: #c0561d14
    }

    #prev svg {
      border-radius: 6px
    }
  </style>
</head>

<body>
  <header>
    <h1>Mots <b>fléchés</b> personnalisés</h1>
    <p>Vos mots, vos définitions, votre thème : la grille se construit toute seule, prête à imprimer en PDF.</p>
  </header>
  <main>
    <section class="card">
      <label>Titre de la grille</label><input type="text" id="title" value="Mots fléchés">
      <div class="row">
        <div><label>Thème</label><select id="theme">
            <option value="anniv">Anniversaire</option>
            <option value="amour">Amour</option>
            <option value="noel">Noël</option>
            <option value="neutre">Neutre</option>
          </select></div>
        <div><label>Police</label><select id="font">
            <option value="sans">Sans empattement</option>
            <option value="serif">Classique</option>
            <option value="mono">Machine</option>
            <option value="ital">Élégante</option>
          </select></div>
      </div>
      <label>Couleur</label>
      <div class="sw" id="sw"></div>
      <label>Vos mots et définitions <span style="text-transform:none;font-weight:400">(un par ligne : MOT :
          définition)</span></label>
      <textarea id="words">PISCINE : Là où tu as fini tout habillé
JUJU : Ton surnom que personne d'autre n'utilise
HOSSEGOR : Nos vacances d'été
RACLETTE : Notre plat de l'hiver
TANGO : Danse du dernier mariage
VELO : Ta passion du dimanche
SERENADE : Chanson sous la fenêtre
CAMPING : Là où la tente s'est envolée</textarea>
      <div class="row">
        <div><label>Taille maximale</label><select id="size">
            <option value="9x12">Petite (9×12)</option>
            <option value="11x15" selected>Moyenne (11×15)</option>
            <option value="13x18">Grande (13×18)</option>
            <option value="12x12">Carrée (12×12)</option>
            <option value="15x15">Grande carrée (15×15)</option>
          </select></div>
      </div>
      <label class="chk"><input type="checkbox" id="full" checked><span><b>Grille pleine</b> : remplit tout le
          rectangle, sans zone vide (les derniers trous deviennent des cases pleines)</span></label>
      <label class="chk" style="margin-top:8px"><input type="checkbox" id="fill" checked><span>Ajouter des petits mots
          de liaison (pris dans le thème) pour agrandir et compléter la grille</span></label>
      <div class="btns"><button class="p" id="go">Générer / relancer</button><button class="s" id="pdf"
          disabled>Télécharger le PDF</button></div>
      <p class="hint">Les mots sont placés en croisement ; ceux qui ne rentrent pas sont signalés. Relancez pour une
        autre disposition.</p>
    </section>
    <section class="card">
      <div class="tabs"><button class="on" data-p="0">Grille</button><button data-p="1">Solution</button></div>
      <p id="info">Cliquez sur « Générer ».</p>
      <div id="prev"></div>
    </section>
  </main>
  <script>
    const COLORS = ['#b8860b', '#d6456f', '#1f6b4a', '#2c5fa8'], NAMES = ['Doré', 'Rose', 'Vert sapin', 'Bleu'];
    const FONTS = {
      sans: { pdf: ['helvetica', 'normal'], css: 'font-family="Helvetica,Arial,sans-serif"' }, serif: { pdf: ['times', 'normal'], css: 'font-family="Times New Roman,Times,serif"' },
      mono: { pdf: ['courier', 'normal'], css: 'font-family="Courier New,monospace"' }, ital: { pdf: ['times', 'italic'], css: 'font-family="Times New Roman,Times,serif" font-style="italic"' }
    };
    const THEMES = {
      anniv: { sub: 'Joyeux anniversaire', c: 0, f: "FETE:On la fait en l'honneur de quelqu'un;GATEAU:Il porte les bougies;BOUGIE:On la souffle;AGE:Il augmente chaque année;CADEAU:On l'offre;JOIE:Bonheur;VOEUX:On les formule;BAL:Danse en société;DANSE:On la pratique en fête;TOAST:On le porte;AMIS:Les invités;" },
      amour: { sub: 'Pour toi', c: 1, f: "COEUR:Il bat;AMOUR:Sentiment tendre;BAISER:Marque de tendresse;ROSE:Fleur romantique;MIEL:Doux comme lui;DOUX:Tendre;NOUS:Toi et moi;DUO:Deux ensemble;TENDRE:Affectueux;LUI:Pronom;ELLE:Pronom;" },
      noel: { sub: 'Joyeux Noël', c: 2, f: "SAPIN:Il porte des boules;NEIGE:Elle tombe l'hiver;ETOILE:Elle brille au sommet;GUI:Plante du baiser;BUCHE:Dessert de Noël;TRAINEAU:Il est tiré par des rennes;LUTIN:Aide du Père Noël;GIVRE:Gelée blanche;CHANT:On l'entonne;CRECHE:Elle accueille l'enfant;" },
      neutre: { sub: 'Mots fléchés', c: 3, f: "" }
    };
    const GEN = "AN:Douze mois;ANE:Il porte le bât;ARE:Cent mètres carrés;AS:Carte maîtresse;BAR:Lieu de comptoir;BEC:Il pique;BUT:Objectif;CAP:Pointe de terre;CHAT:Il ronronne;CLE:Elle ouvre;COL:Passage de montagne;COQ:Il chante;CRI:Éclat de voix;DIX:Deux fois cinq;DOS:Il se tourne;DUC:Noble;EN:Dans;ERE:Période;EUX:Pronom;FEE:Elle a une baguette;FIN:Terme;FOU:Dingue;GAI:Joyeux;GEL:Il fait glisser;IL:Pronom;IRE:Colère;JE:Pronom;LAC:Étendue d'eau;LIT:Il fait dormir;LUNE:Astre nocturne;MAI:Mois fleuri;MAL:Douleur;ME:Pronom;MUR:Il sépare;NE:Négation;NID:Il abrite l'oiseau;NON:Refus;NU:Sans habit;OH:Surprise;OIE:Elle cacarde;ON:Pronom;OUI:Accord;PAIN:Il est quotidien;PAS:Enjambée;PEU:Pas beaucoup;PI:Lettre grecque;PIN:Arbre à pignons;PLAT:Sans relief;PRE:Herbage;RAT:Rongeur;RE:Note;RHUM:Alcool de canne;RIZ:Céréale;ROC:Pierre dure;RUE:Voie urbaine;SEL:Il assaisonne;SOIR:Fin du jour;SUD:Midi;TA:Possessif;TE:Pronom;THE:Boisson chaude;TOI:Pronom;TON:Possessif;TOUR:Elle penche à Pise;USE:Fatigue;VIN:Boisson de vigne;VUE:Un des cinq sens;YEUX:Ils voient;ZEN:Serein;PLAGE:Sable au bord de l'eau;SOLEIL:Il brille le jour;JARDIN:Lieu de fleurs;FORET:Beaucoup d'arbres;ECOLE:On y apprend;VOYAGE:Déplacement lointain;LIVRE:On le lit;MUSIQUE:Art des sons;TABLE:On s'y met pour manger;CUISINE:Lieu des recettes;AVENTURE:Escapade;SOURIRE:Il illumine un visage;MONTAGNE:Grande hauteur;NUAGE:Il est dans le ciel;ORAGE:Il gronde;PLUIE:Elle mouille;VENT:Il souffle;RIVIERE:Elle coule vers la mer;ET:Conjonction;OR:Métal précieux;UN:Premier nombre;LA:Note de musique;SI:Autre note;MI:Note du milieu;OS:Ils charpentent;ILE:Terre dans la mer;EAU:Elle coule;AMI:Compagnon;ART:Peinture ou musique;ROI:Souverain;SOL:Terre ferme;ETE:Saison chaude;MER:Grande étendue;RIRE:Il détend;JEU:Passe-temps;VIE:Elle commence à la naissance;RUE:Voie en ville;NOM:Il identifie;AIR:On le respire;THE:Boisson chaude;CAFE:Boisson du matin;PAIN:Il est chez le boulanger;LUNE:Astre de la nuit;ARBRE:Il a des feuilles;LIVRE:On le lit;PLAGE:Sable et vagues;SOLEIL:Étoile du jour;AMIE:Compagne;RIEN:Zéro;SEL:Il relève le goût;ENCRE:Elle noircit la plume;IDEE:Elle germe;ROUTE:Elle mène quelque part;NUIT:Après le soir;ETAT:Manière d'être;RIZ:Céréale asiatique;OUI:Réponse positive;ANE:Il a de grandes oreilles;LAC:Étendue d'eau douce;";
    const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^A-Z]/g, '');
    const parse = (s, u) => s.split(/;|\n/).map(l => { const i = l.search(/[:=]/); const w = norm(i < 0 ? l : l.slice(0, i)); return w.length > 1 ? { w, c: (i < 0 ? '' : l.slice(i + 1)).trim() || '?', u } : null }).filter(Boolean);
    const $ = id => document.getElementById(id), esc = t => String(t).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
    const mix = (h, k) => '#' + [1, 3, 5].map(i => Math.round(parseInt(h.substr(i, 2), 16) * (1 - k) + 255 * k).toString(16).padStart(2, '0')).join('');

    /* ── Moteur de grille ─────────────────────────────────────────────── */
    function solver(R, C) {
      const g = Array.from({ length: R }, () => Array(C).fill(null)), placed = [];
      const fit = (w, r, c, d) => {
        const dr = d, dc = 1 - d, cr = r - dr, cc = c - dc, L = w.length;
        if (cr < 0 || cc < 0 || r + dr * (L - 1) >= R || c + dc * (L - 1) >= C) return -1;
        const cl = g[cr][cc]; if (cl && (cl.t === 'L' || (cl.t === 'C' && (d ? cl.v : cl.h)))) return -1;
        const er = r + dr * L, ec = c + dc * L; if (er < R && ec < C && g[er][ec] && g[er][ec].t === 'L') return -1;
        let x = 0;
        for (let i = 0; i < L; i++) {
          const rr = r + dr * i, qq = c + dc * i, k = g[rr][qq];
          if (k) { if (k.t !== 'L' || k.ch !== w[i] || (d ? k.v : k.h)) return -1; x++; }
          else for (const s of [-1, 1]) { const nr = rr + dc * s, nc = qq + dr * s; if (nr >= 0 && nr < R && nc >= 0 && nc < C && g[nr][nc] && g[nr][nc].t === 'L') return -1; }
        }
        return x;
      };
      const put = (o, r, c, d) => {
        const dr = d, dc = 1 - d, L = o.w.length, cr = r - dr, cc = c - dc;
        for (let i = 0; i < L; i++) { const rr = r + dr * i, qq = c + dc * i; const k = g[rr][qq] || (g[rr][qq] = { t: 'L', ch: o.w[i] }); k[d ? 'v' : 'h'] = 1; }
        const cl = g[cr][cc] && g[cr][cc].t === 'C' ? g[cr][cc] : (g[cr][cc] = { t: 'C' });
        cl[d ? 'v' : 'h'] = { c: o.c };
        const er = r + dr * L, ec = c + dc * L; if (er < R && ec < C && !g[er][ec]) g[er][ec] = { t: 'X' };
        placed.push(o);
      };
      const best = (w, min) => {
        let b = null;
        for (let d = 0; d < 2; d++)for (let r = 0; r < R; r++)for (let c = 0; c < C; c++) {
          const s = fit(w, r, c, d);
          if (s >= min) { const sc = s * 100 + Math.random() * 20 - (Math.abs(r - R / 2) + Math.abs(c - C / 2)) * .3; if (!b || sc > b.sc) b = { sc, r, c, d }; }
        }
        return b;
      };
      return { g, put, best, placed };
    }
    function fillAll(s, F) {
      const used = new Set(s.placed.map(o => o.w)); let n = 0;
      for (const min of [2, 1, 0]) for (; ;) {
        let b = null, bo = null, k = 0;
        for (const o of F) { if (used.has(o.w) || ++k > 150) continue; const x = s.best(o.w, min); if (x) { x.sc += o.w.length * 12; if (!b || x.sc > b.sc) { b = x; bo = o } } }
        if (!b) break; s.put(bo, b.r, b.c, b.d); used.add(bo.w); n++;
      }
      return n;
    }
    function build(U, F, R, C, useF, full) {
      let top = null;
      for (let n = 0; n < 120; n++) {
        const s = solver(R, C), miss = [];
        [...U].sort((a, b) => b.w.length - a.w.length + (Math.random() - .5) * 5).forEach((o, i) => {
          if (!i) return s.put(o, R >> 1, Math.max(1, (C - o.w.length) >> 1), 0);
          const b = s.best(o.w, 1); b ? s.put(o, b.r, b.c, b.d) : miss.push(o);
        });
        let rs = [], cs = []; s.g.forEach((row, r) => row.forEach((k, c) => { if (k) { rs.push(r); cs.push(c) } }));
        const area = (Math.max(...rs) - Math.min(...rs) + 1) * (Math.max(...cs) - Math.min(...cs) + 1), sc = miss.length * 1e6 + area;
        if (!top || sc < top.sc) top = { s, miss, sc };
      }
      const { s, miss } = top; let added = 0;
      if (full) added = fillAll(s, F); else if (useF) {
        const used = new Set(s.placed.map(o => o.w)), pool = F.filter(o => o.w.length < C);
        const dens = () => s.g.flat().filter(k => k && k.t === 'L').length / (R * C);
        while (added < 45 && dens() < .45) {
          let b = null, bo = null;
          for (const o of pool) { if (used.has(o.w)) continue; const x = s.best(o.w, 2); if (x && (!b || x.sc > b.sc)) { b = x; bo = o } }
          if (!b) break; s.put(bo, b.r, b.c, b.d); used.add(bo.w); added++;
        }
      }
      const pts = []; s.g.forEach((row, r) => row.forEach((k, c) => { if (k) pts.push([r, c]) }));
      const B = full ? { r0: 0, r1: R - 1, c0: 0, c1: C - 1 } : { r0: Math.min(...pts.map(p => p[0])), r1: Math.max(...pts.map(p => p[0])), c0: Math.min(...pts.map(p => p[1])), c1: Math.max(...pts.map(p => p[1])) };
      const pct = Math.round(100 * pts.filter(([r, c]) => s.g[r][c].t !== 'X').length / ((B.r1 - B.r0 + 1) * (B.c1 - B.c0 + 1)));
      return { g: s.g, miss, added, ...B, pct, full, nUser: s.placed.length - added };
    }

    /* ── Dessin (même code pour l'aperçu SVG et le PDF) ────────────────── */
    function svgD() {
      let s = ''; return {
        out: () => s,
        rect(x, y, w, h, f, st, lw) { s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f || 'none'}" stroke="${st || 'none'}" stroke-width="${lw || 0}"/>` },
        tri(a, b, c, d, e, f, col) { s += `<polygon points="${a},${b} ${c},${d} ${e},${f}" fill="${col}"/>` },
        text(t, x, y, sz, p) { s += `<text x="${x}" y="${y}" font-size="${sz * .3528}" fill="${p.color || '#222'}" text-anchor="${p.align === 'c' ? 'middle' : 'start'}" dominant-baseline="central" font-weight="${p.bold ? 700 : 400}" ${FONTS[p.font].css}>${esc(t)}</text>` }
      }
    }
    function pdfD(doc) {
      return {
        rect(x, y, w, h, f, st, lw) { if (f) doc.setFillColor(f); if (st) { doc.setDrawColor(st); doc.setLineWidth(lw || .2) } if (f || st) doc.rect(x, y, w, h, f && st ? 'FD' : f ? 'F' : 'S') },
        tri(a, b, c, d, e, f, col) { doc.setFillColor(col); doc.triangle(a, b, c, d, e, f, 'F') },
        text(t, x, y, sz, p) { const f = FONTS[p.font].pdf; doc.setFont(f[0], p.bold ? (f[1] === 'italic' ? 'bolditalic' : 'bold') : f[1]); doc.setFontSize(sz); doc.setTextColor(p.color || '#222222'); doc.text(t, x, y, { align: p.align === 'c' ? 'center' : 'left', baseline: 'middle' }) }
      }
    }
    function fitText(D, s, x, y, w, h, font) {
      let sz = 9.5, lines;
      for (; sz > 3.5; sz -= .25) {
        const mw = w / (sz * .3528 * (font === 'mono' ? .62 : .52)), L = []; let cur = '';
        s.split(/\s+/).forEach(t => { if ((cur + ' ' + t).trim().length <= mw) cur = (cur + ' ' + t).trim(); else { if (cur) L.push(cur); cur = t } });
        if (cur) L.push(cur); lines = L;
        if (L.length * sz * .3528 * 1.15 <= h && L.every(l => l.length <= mw)) break;
      }
      const lh = sz * .3528 * 1.15, y0 = y + (h - lines.length * lh) / 2 + lh / 2;
      lines.forEach((l, i) => D.text(l, x + w / 2, y0 + i * lh, sz, { align: 'c', color: '#222', font }));
    }
    function draw(D, S, sol) {
      const { g, r0, r1, c0, c1, o, full } = S, rows = r1 - r0 + 1, cols = c1 - c0 + 1, cell = Math.min(186 / cols, 242 / rows), x0 = (210 - cell * cols) / 2, y0 = 38 + (242 - cell * rows) / 2, ac = o.color, tint = mix(ac, .86);
      D.rect(0, 0, 210, 297, '#ffffff'); D.rect(6, 6, 198, 285, null, ac, .9); D.rect(9, 9, 192, 279, null, ac, .25);
      D.text(o.title, 105, 23, 22, { align: 'c', color: ac, bold: true, font: o.font });
      D.text(sol ? 'Solution' : o.sub, 105, 32, 9, { align: 'c', color: '#777', font: o.font });
      for (let r = r0; r <= r1; r++)for (let c = c0; c <= c1; c++) {
        const k = g[r][c], x = x0 + (c - c0) * cell, y = y0 + (r - r0) * cell;
        if (!k || k.t === 'X') { D.rect(x, y, cell, cell, full ? mix(ac, .5) : tint, full ? '#555' : null, .25); continue }
        if (k.t === 'L') { D.rect(x, y, cell, cell, '#ffffff', '#555', .25); if (sol) D.text(k.ch, x + cell / 2, y + cell / 2, cell * 1.6, { align: 'c', color: ac, bold: true, font: o.font }); continue }
        D.rect(x, y, cell, cell, tint, '#555', .25);
        const both = k.h && k.v, hh = both ? cell / 2 : cell, a = 1.3;
        if (k.h) { fitText(D, k.h.c, x + .6, y + .3, cell - 2.4, hh - .6, o.font); const ay = y + hh / 2; D.tri(x + cell - 1.5, ay - a, x + cell - 1.5, ay + a, x + cell + .3, ay, ac) }
        if (k.v) { const vy = both ? y + cell / 2 : y; fitText(D, k.v.c, x + .6, vy + .3, cell - 1.2, hh - 1.9, o.font); D.tri(x + cell / 2 - a, y + cell - 1.5, x + cell / 2 + a, y + cell - 1.5, x + cell / 2, y + cell + .3, ac) }
      }
    }

    /* ── Interface ───────────────────────────────────────────────────── */
    let S = null, page = 0, col = 0;
    $('sw').innerHTML = COLORS.map((c, i) => `<button style="background:${c}" title="${NAMES[i]}" data-c="${i}"></button>`).join('');
    const setCol = i => { col = i; document.querySelectorAll('#sw button').forEach(b => b.classList.toggle('on', +b.dataset.c === i)); document.documentElement.style.setProperty('--acc', COLORS[i]); S && (S.o.color = COLORS[i], show()) };
    $('sw').onclick = e => { const b = e.target.closest('button'); b && setCol(+b.dataset.c) };
    $('theme').onchange = () => setCol(THEMES[$('theme').value].c);
    setCol(0);
    document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { page = +b.dataset.p; document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b)); show() });
    function show() { if (!S) return; const D = svgD(); draw(D, S, page === 1); $('prev').innerHTML = `<svg viewBox="0 0 210 297" xmlns="http://www.w3.org/2000/svg">${D.out()}</svg>` }
    $('go').onclick = () => {
      const th = THEMES[$('theme').value], [C, R] = $('size').value.split('x').map(Number);
      const U = parse($('words').value, true).filter(o => o.w.length < C);
      if (!U.length) { $('info').className = 'w'; $('info').textContent = 'Ajoutez au moins un mot (au format MOT : définition).'; return }
      const r = build(U, [...parse(th.f, false), ...parse(GEN, false)].sort(() => Math.random() - .5), R, C, $('fill').checked, $('full').checked);
      S = { ...r, o: { title: $('title').value || 'Mots fléchés', sub: th.sub, color: COLORS[col], font: $('font').value } };
      const tot = U.length; $('info').className = r.miss.length ? 'w' : '';
      $('info').textContent = `${r.nUser}/${tot} de vos mots placés` + (r.added ? ` · ${r.added} mots de liaison ajoutés` : '') + (r.full ? ` · grille remplie à ${r.pct} %` : '') + (r.miss.length ? ` · non placés : ${r.miss.map(o => o.w).join(', ')} (relancez ou agrandissez la grille)` : '');
      $('pdf').disabled = false; show();
    };
    $('pdf').onclick = async () => {
      const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
      draw(pdfD(doc), S, false); doc.addPage(); draw(pdfD(doc), S, false); doc.addPage(); draw(pdfD(doc), S, true);
      const name = 'mots-fleches.pdf', dl = window.claude && await claude.use('downloads');
      if (dl) { try { await dl.save({ filename: name, data: doc.output('arraybuffer') }) } catch (e) { } } else doc.save(name);
    };
  </script>
